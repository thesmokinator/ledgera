name: Build verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            libfuse2

      - name: Install Windows cross-build dependencies
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            nsis \
            pkg-config \
            libssl-dev \
            zip

      - name: Install cargo-xwin
        if: matrix.platform == 'windows'
        run: cargo install cargo-xwin --locked

      - name: Add Windows Rust target
        if: matrix.platform == 'windows'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build macOS app and DMG
        if: matrix.platform == 'macos'
        run: npx tauri build --bundles app,dmg

      - name: Collect macOS artifacts
        if: matrix.platform == 'macos'
        run: |
          mkdir -p build-artifacts
          APP_PATH=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "build-artifacts/${APP_NAME}-macos-app.zip"
          cp src-tauri/target/release/bundle/dmg/*.dmg build-artifacts/

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: npx tauri build --bundles deb,appimage

      - name: Collect Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          mkdir -p build-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb build-artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage build-artifacts/

      - name: Build Windows installer and portable zip with cargo-xwin
        if: matrix.platform == 'windows'
        run: npm run build:win

      - name: Collect Windows artifacts
        if: matrix.platform == 'windows'
        run: |
          mkdir -p build-artifacts
          cp ./*-win-x64-setup.exe build-artifacts/
          cp ./*-win-x64-portable.zip build-artifacts/

      - name: Upload ${{ matrix.platform }} build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ledgera-${{ matrix.platform }}-build-${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 7
